<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    .dashboard {
      display: grid;
      grid-template-rows: 56px 1fr;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #58a6ff;
    }
    .header-logo svg { color: #58a6ff; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .badge {
      background: #1f6feb22;
      border: 1px solid #1f6feb55;
      color: #58a6ff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.live { background: #1a7f3722; border-color: #2ea04355; color: #3fb950; }
    .timestamp { font-size: 13px; color: #8b949e; }

    /* ── Main layout ── */
    .main {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 0;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: #161b22;
      border-right: 1px solid #30363d;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 8px 4px;
    }
    .symbol-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .symbol-item:hover { background: #21262d; }
    .symbol-item.active { background: #1f6feb22; border: 1px solid #1f6feb44; }
    .symbol-name { font-size: 13px; font-weight: 600; }
    .symbol-price { font-size: 12px; color: #8b949e; }
    .symbol-change { font-size: 11px; font-weight: 600; }
    .up { color: #3fb950; }
    .down { color: #f85149; }

    /* ── Chart area ── */
    .chart-area {
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #0d1117;
      overflow: hidden;
    }
    .chart-toolbar {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #21262d;
    }
    .chart-symbol { font-size: 22px; font-weight: 700; }
    .chart-price { font-size: 20px; font-weight: 600; color: #3fb950; }
    .chart-change-info { font-size: 13px; }
    .tf-group {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .tf-btn {
      background: none;
      border: 1px solid transparent;
      color: #8b949e;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tf-btn:hover { color: #e6edf3; border-color: #30363d; }
    .tf-btn.active { background: #1f6feb22; border-color: #1f6feb55; color: #58a6ff; }

    .chart-wrapper {
      position: relative;
      padding: 0;
      overflow: hidden;
    }
    #main-chart { width: 100%; height: 100%; }

    .volume-bar-area {
      padding: 0 20px 14px;
      border-top: 1px solid #21262d;
    }
    .volume-label {
      font-size: 11px;
      color: #8b949e;
      padding: 8px 0 4px;
    }
    #volume-chart { width: 100%; height: 80px; }

    /* ── Right panel ── */
    .right-panel {
      background: #161b22;
      border-left: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-section {
      padding: 16px;
      border-bottom: 1px solid #21262d;
    }
    .panel-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-card {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px;
    }
    .stat-label { font-size: 10px; color: #8b949e; margin-bottom: 4px; }
    .stat-value { font-size: 15px; font-weight: 700; }

    .order-book {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ob-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      font-size: 12px;
      padding: 3px 0;
      position: relative;
    }
    .ob-row .bar {
      position: absolute;
      top: 0; bottom: 0;
      opacity: 0.08;
      border-radius: 2px;
    }
    .ob-ask .bar { background: #f85149; right: 0; }
    .ob-bid .bar { background: #3fb950; right: 0; }
    .ob-header { font-size: 10px; color: #8b949e; font-weight: 600; margin-bottom: 4px; }
    .ob-spread {
      text-align: center;
      font-size: 11px;
      color: #8b949e;
      padding: 4px 0;
      border-top: 1px solid #21262d;
      border-bottom: 1px solid #21262d;
      margin: 2px 0;
    }
    .ob-price-ask { color: #f85149; font-weight: 600; }
    .ob-price-bid { color: #3fb950; font-weight: 600; }
    .ob-size { text-align: right; color: #8b949e; }
    .ob-total { text-align: right; color: #6e7681; }

    .trade-list { display: flex; flex-direction: column; gap: 3px; }
    .trade-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      font-size: 11px;
      padding: 2px 0;
    }
    .trade-time { color: #6e7681; }
    .trade-size { text-align: right; color: #8b949e; }

    .pnl-card {
      background: linear-gradient(135deg, #1a7f3722, #1a7f3711);
      border: 1px solid #2ea04355;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .pnl-label { font-size: 11px; color: #8b949e; margin-bottom: 6px; }
    .pnl-value { font-size: 28px; font-weight: 800; color: #3fb950; }
    .pnl-sub { font-size: 12px; color: #3fb950; margin-top: 4px; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useRef, useEffect, useState } = React;

    /* ── sample data generators ── */
    function genCandles() {
      const data = [];
      let t = new Date('2024-01-02');
      let close = 42000;
      for (let i = 0; i < 120; i++) {
        const open = close;
        const change = (Math.random() - 0.48) * 800;
        close = Math.max(30000, open + change);
        const high = Math.max(open, close) + Math.random() * 300;
        const low  = Math.min(open, close) - Math.random() * 300;
        data.push({
          time: t.toISOString().slice(0, 10),
          open: +open.toFixed(2),
          high: +high.toFixed(2),
          low:  +low.toFixed(2),
          close: +close.toFixed(2),
        });
        t.setDate(t.getDate() + 1);
      }
      return data;
    }

    function genVolume(candles) {
      return candles.map(c => ({
        time: c.time,
        value: +(Math.random() * 5000 + 500).toFixed(0),
        color: c.close >= c.open ? '#3fb95044' : '#f8514944',
      }));
    }

    const CANDLES = genCandles();
    const VOLUMES = genVolume(CANDLES);
    const LAST = CANDLES[CANDLES.length - 1];

    const SYMBOLS = [
      { name: 'BTC/USDT', price: '43,250.10', change: '+2.34%', up: true },
      { name: 'ETH/USDT', price: '2,650.88',  change: '+1.12%', up: true },
      { name: 'SOL/USDT', price: '98.45',      change: '-0.87%', up: false },
      { name: 'BNB/USDT', price: '410.20',     change: '+0.55%', up: true },
      { name: 'XRP/USDT', price: '0.5812',     change: '-1.23%', up: false },
    ];

    const ASK_ORDERS = [
      { price: '43,290', size: '0.842', total: '36,450' },
      { price: '43,280', size: '1.230', total: '53,134' },
      { price: '43,270', size: '0.558', total: '24,144' },
      { price: '43,265', size: '2.100', total: '90,856' },
      { price: '43,260', size: '0.320', total: '13,843' },
    ];
    const BID_ORDERS = [
      { price: '43,250', size: '1.540', total: '66,605' },
      { price: '43,240', size: '0.770', total: '33,294' },
      { price: '43,230', size: '3.200', total: '138,336'},
      { price: '43,220', size: '0.430', total: '18,584' },
      { price: '43,210', size: '1.100', total: '47,531' },
    ];
    const RECENT_TRADES = [
      { time: '14:32:05', price: '43,250', size: '0.124', up: true  },
      { time: '14:32:04', price: '43,248', size: '0.531', up: false },
      { time: '14:32:02', price: '43,252', size: '0.080', up: true  },
      { time: '14:32:01', price: '43,245', size: '1.200', up: false },
      { time: '14:31:59', price: '43,255', size: '0.340', up: true  },
      { time: '14:31:57', price: '43,260', size: '0.092', up: true  },
    ];

    /* ── Chart component ── */
    function MainChart() {
      const mainRef   = useRef(null);
      const volRef    = useRef(null);
      const [tf, setTf] = useState('1D');

      useEffect(() => {
        const chartOpts = {
          layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
          grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          rightPriceScale: { borderColor: '#30363d' },
          timeScale: { borderColor: '#30363d', timeVisible: true },
          width:  mainRef.current.offsetWidth,
          height: mainRef.current.offsetHeight,
        };

        const chart = LightweightCharts.createChart(mainRef.current, chartOpts);
        const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
          upColor: '#3fb950', downColor: '#f85149',
          borderUpColor: '#3fb950', borderDownColor: '#f85149',
          wickUpColor: '#3fb950', wickDownColor: '#f85149',
        });
        candleSeries.setData(CANDLES);

        const volChart = LightweightCharts.createChart(volRef.current, {
          layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
          grid: { vertLines: { color: '#21262d' }, horzLines: { color: 'transparent' } },
          rightPriceScale: { borderColor: '#30363d', scaleMargins: { top: 0.1, bottom: 0 } },
          timeScale: { borderColor: '#30363d', visible: false },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          width:  volRef.current.offsetWidth,
          height: volRef.current.offsetHeight,
        });
        const volSeries = volChart.addSeries(LightweightCharts.HistogramSeries, {
          priceFormat: { type: 'volume' },
          priceScaleId: '',
        });
        volSeries.setData(VOLUMES);

        /* sync time scales */
        chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
          if (range) volChart.timeScale().setVisibleLogicalRange(range);
        });

        const ro = new ResizeObserver(() => {
          chart.applyOptions({ width: mainRef.current.offsetWidth, height: mainRef.current.offsetHeight });
          volChart.applyOptions({ width: volRef.current.offsetWidth, height: volRef.current.offsetHeight });
        });
        ro.observe(mainRef.current);

        return () => { chart.remove(); volChart.remove(); ro.disconnect(); };
      }, []);

      const tfs = ['15m', '1H', '4H', '1D', '1W'];

      return (
        <>
          <div className="chart-toolbar">
            <span className="chart-symbol">BTC/USDT</span>
            <span className="chart-price">{LAST.close.toLocaleString()}</span>
            <span className="chart-change-info up">+2.34%&nbsp;今日</span>
            <div className="tf-group">
              {tfs.map(t => (
                <button key={t} className={`tf-btn${tf===t?' active':''}`} onClick={() => setTf(t)}>{t}</button>
              ))}
            </div>
          </div>
          <div className="chart-wrapper">
            <div id="main-chart" ref={mainRef} style={{width:'100%',height:'100%'}}/>
          </div>
          <div className="volume-bar-area">
            <div className="volume-label">VOLUME</div>
            <div id="volume-chart" ref={volRef} style={{width:'100%',height:'80px'}}/>
          </div>
        </>
      );
    }

    /* ── App ── */
    function App() {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
      }, []);

      return (
        <div className="dashboard">
          {/* Header */}
          <header className="header">
            <div className="header-logo">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
              </svg>
              AutoTrade Dashboard
            </div>
            <div className="header-right">
              <span className="badge live">● LIVE</span>
              <span className="badge">Paper Trading</span>
              <span className="timestamp">{now.toLocaleTimeString('ja-JP')}</span>
            </div>
          </header>

          <div className="main">
            {/* Sidebar */}
            <aside className="sidebar">
              <div className="sidebar-title">ウォッチリスト</div>
              {SYMBOLS.map((s, i) => (
                <div key={s.name} className={`symbol-item${i===0?' active':''}`}>
                  <div>
                    <div className="symbol-name">{s.name}</div>
                    <div className="symbol-price">{s.price}</div>
                  </div>
                  <div className={`symbol-change ${s.up?'up':'down'}`}>{s.change}</div>
                </div>
              ))}
            </aside>

            {/* Chart */}
            <section className="chart-area">
              <MainChart />
            </section>

            {/* Right panel */}
            <aside className="right-panel">
              {/* PnL */}
              <div className="panel-section">
                <div className="panel-section-title">今日の損益</div>
                <div className="pnl-card">
                  <div className="pnl-label">Realized P&L (USDT)</div>
                  <div className="pnl-value">+1,284.50</div>
                  <div className="pnl-sub">▲ 3.06% today</div>
                </div>
              </div>

              {/* Stats */}
              <div className="panel-section">
                <div className="panel-section-title">マーケット統計</div>
                <div className="stat-grid">
                  <div className="stat-card">
                    <div className="stat-label">24H HIGH</div>
                    <div className="stat-value up">44,120</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">24H LOW</div>
                    <div className="stat-value down">42,010</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">24H VOL</div>
                    <div className="stat-value">18.4K</div>
                  </div>
                  <div className="stat-card">
                    <div className="stat-label">FUNDING</div>
                    <div className="stat-value up">0.012%</div>
                  </div>
                </div>
              </div>

              {/* Order Book */}
              <div className="panel-section">
                <div className="panel-section-title">板情報</div>
                <div className="order-book">
                  <div className="ob-row ob-header">
                    <span>価格</span><span style={{textAlign:'right'}}>数量</span><span style={{textAlign:'right'}}>合計</span>
                  </div>
                  {ASK_ORDERS.map((o, i) => (
                    <div key={i} className="ob-row ob-ask">
                      <div className="bar" style={{width:`${20+i*15}%`}}/>
                      <span className="ob-price-ask">{o.price}</span>
                      <span className="ob-size">{o.size}</span>
                      <span className="ob-total">{o.total}</span>
                    </div>
                  ))}
                  <div className="ob-spread">スプレッド 10.00 (0.02%)</div>
                  {BID_ORDERS.map((o, i) => (
                    <div key={i} className="ob-row ob-bid">
                      <div className="bar" style={{width:`${60-i*10}%`}}/>
                      <span className="ob-price-bid">{o.price}</span>
                      <span className="ob-size">{o.size}</span>
                      <span className="ob-total">{o.total}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Recent trades */}
              <div className="panel-section">
                <div className="panel-section-title">最近の約定</div>
                <div className="trade-list">
                  {RECENT_TRADES.map((t, i) => (
                    <div key={i} className="trade-row">
                      <span className="trade-time">{t.time}</span>
                      <span className={t.up?'up':'down'}>{t.price}</span>
                      <span className="trade-size">{t.size}</span>
                    </div>
                  ))}
                </div>
              </div>
            </aside>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
